<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Assessment | BEdu</title>

    <link
        rel="stylesheet"
        href="css/assessment.css"
    >

</head>

<body>

    <main class="assessment-container">


        <!-- Header -->

        <header class="test-header">

            <a
                href="assessments.html"
                class="back-link"
            >
                ← Back to Assessments
            </a>

            <div class="test-title">

                <span id="testCategory">
                    ASSESSMENT
                </span>

                <h1 id="testTitle">
                    Assessment
                </h1>

            </div>

            <div class="timer">

                <span>⏱</span>

                <strong id="timer">
                    10:00
                </strong>

            </div>

        </header>


        <!-- Progress -->

        <div class="progress-section">

            <div class="progress-info">

                <span id="questionNumber">
                    Question 1 of 10
                </span>

                <span id="progressPercent">
                    10%
                </span>

            </div>

            <div class="progress-bar">

                <div
                    id="progressFill"
                    class="progress-fill"
                ></div>

            </div>

        </div>


        <!-- Question -->

        <section
            id="quizSection"
            class="quiz-card"
        >

            <div class="question-number">
                QUESTION <span id="currentNumber">01</span>
            </div>

            <h2 id="questionText">
                Loading question...
            </h2>

            <div
                id="optionsContainer"
                class="options-container"
            >
            </div>

        </section>


        <!-- Navigation -->

        <div
            id="navigation"
            class="navigation"
        >

            <button
                id="previousBtn"
                class="secondary-btn"
            >
                ← Previous
            </button>

            <button
                id="nextBtn"
                class="primary-btn"
            >
                Next →
            </button>

        </div>


        <!-- Result -->

        <section
            id="resultSection"
            class="result-section"
        >

            <div class="result-icon">
                ✓
            </div>

            <span class="result-label">
                ASSESSMENT COMPLETED
            </span>

            <h1>Your Result</h1>

            <div class="score-display">

                <span id="score">
                    0
                </span>

                <small>
                    / 10
                </small>

            </div>

            <h2 id="resultMessage">
                Good job!
            </h2>

            <p id="resultDescription">
                Your assessment has been completed.
            </p>

            <div class="result-details">

                <div>
                    <strong id="correctAnswers">
                        0
                    </strong>
                    <span>Correct</span>
                </div>

                <div>
                    <strong id="wrongAnswers">
                        0
                    </strong>
                    <span>Wrong</span>
                </div>

                <div>
                    <strong id="finalPercentage">
                        0%
                    </strong>
                    <span>Score</span>
                </div>

            </div>

            <div class="result-actions">

                <a
                    href="assessments.html"
                    class="primary-btn"
                >
                    Take Another Assessment
                </a>

                <a
                    href="dashboard.html"
                    class="secondary-btn"
                >
                    Go to Dashboard
                </a>

            </div>

        </section>

    </main>


    <script src="js/assessment.js"></script>

</body>

</html>
